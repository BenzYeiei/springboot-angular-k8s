apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: dev
type: Opaque
stringData:
  POSTGRES_DB: springbootangulark8s
  POSTGRES_USER: admin
  POSTGRES_PASSWORD: myadmin
---
apiVersion: v1
kind: Secret
metadata:
  name: keycloak-secret
  namespace: dev
type: Opaque
stringData:
  KEYCLOAK_ADMIN: admin
  KEYCLOAK_ADMIN_PASSWORD: myadmin
---
apiVersion: v1
kind: Secret
metadata:
  name: pgadmin-secret
  namespace: dev
type: Opaque
stringData:
  PGADMIN_DEFAULT_EMAIL: admin@admin.com
  PGADMIN_DEFAULT_PASSWORD: myadmin
